name: prod_test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: real_estate_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d real_estate_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./fixtures/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/real_estate_test
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

  batch:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/real_estate_test
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.batch.batch_update
    profiles:
      - batch
